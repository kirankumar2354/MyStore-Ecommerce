
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MyStore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F4F7FA;
            color: #16324F;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: #16324F;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #20A39E;
        }

        .hero {
            background: linear-gradient(120deg, #16324F, #177E7A);
            color: white;
            text-align: center;
            padding: 32px 15px;
        }

        .hero h1 {
            margin: 0 0 8px;
        }

        .hero p {
            margin-bottom: 0;
            color: #D9F3F1;
        }

        .register-container {
            width: min(430px, 90%);
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(22, 50, 79, 0.10);
        }

        .register-container h2 {
            text-align: center;
            color: #16324F;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #20A39E;
            border-color: #20A39E;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #20A39E;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #177E7A;
        }

        .login-link {
            text-align: center;
            margin-bottom: 0;
            color: #64748B;
        }

        .login-link a {
            color: #177E7A;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #FEE2E2;
            color: #B91C1C;
            padding: 10px;
            border-radius: 6px;
        }

        footer {
            margin-top: auto;
            background: #16324F;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 480px) {
            nav {
                padding: 16px;
            }

            .hero h1 {
                font-size: 25px;
            }

            .register-container {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<nav>
    <h2>MyStore</h2>
    <a href="/">← Back to Home</a>
</nav>

<section class="hero">
    <h1>Create Your Account</h1>
    <p>Join MyStore and start shopping today!</p>
</section>

<div class="register-container">
    <h2>Sign Up</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Choose a username" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Create a password" required>

        <button type="submit">Create Account</button>
    </form>

    <p class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>
</div>

<footer>
    <p>© 2026 MyStore | Happy Shopping!</p>
</footer>

</body>
</html>
